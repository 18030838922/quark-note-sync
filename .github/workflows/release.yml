name: Release plugin

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify tag and build
        run: |
          node -e 'const version = require("./manifest.json").version; if (version !== process.env.GITHUB_REF_NAME || !/^\d+\.\d+\.\d+$/.test(version)) process.exit(1);'
          npm ci
          npm run check
          npm run build
      - name: Attest release files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --verify-tag \
            --title "Quark Note Sync $GITHUB_REF_NAME" \
            --generate-notes
